name: Deploy functions
on:
  workflow_dispatch:
    inputs:
      cluster_ip:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
      config_base64:
        required: true
        type: string
      vim_id:
        required: true
        type: string

jobs:
  ondemand-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ============================================
      # INÍCIO - Capturar timestamp inicial
      # ============================================
      - name: 📊 Start Timer
        id: start-timer
        run: |
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          echo "🕐 Workflow started at: $(date '+%Y-%m-%d %H:%M:%S')"
      
      # ============================================
      # SETUP
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: 📊 Checkpoint - Checkout
        run: |
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          echo "✓ Checkout completed in ${ELAPSED}s"

      - name: Configure SSH
        run: |
          START=$(date +%s)
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/proxy.key
          chmod 600 ~/.ssh/proxy.key
          echo "$OSM_KEY" > ~/.ssh/osm.key
          chmod 600 ~/.ssh/osm.key
          cat >>~/.ssh/config <<END
          Host proxy
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/proxy.key
            StrictHostKeyChecking no
            Port $SSH_PORT
          Host osm
            HostName $OSM_HOST
            User $OSM_USER
            IdentityFile ~/.ssh/osm.key
            StrictHostKeyChecking no
            ProxyJump proxy
          Host cluster
            HostName $CLUSTER_HOST
            User packer
            StrictHostKeyChecking no
            ProxyJump proxy
          END
          END=$(date +%s)
          echo "⏱️  SSH config: $((END - START))s"
        env:
          SSH_USER: ${{ secrets.PROXY_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PROXY_KEY }}
          SSH_HOST: ${{ secrets.PROXY_HOST }}
          SSH_PORT: ${{ secrets.PROXY_PORT }}
          OSM_USER: ${{ secrets.USERNAME }}
          OSM_HOST: ${{ secrets.HOST }}
          OSM_KEY: ${{ secrets.KEY }}
          OSM_PORT: ${{ secrets.HOST }}
          CLUSTER_HOST: ${{ inputs.cluster_ip }}

      - name: Install sshpass
        run: |
          sudo apt-get install -y sshpass

      - name: Retrieve OSM token
        run: |
          START=$(date +%s)
          TOKEN=$(ssh -o PreferredAuthentications=publickey osm \
          "curl -k -X POST https://${OSM_HOSTNAME}/osm/admin/v1/tokens \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{
              \"username\": \"${OSM_USER}\",
              \"password\": \"${OSM_PASSWORD}\",
              \"project_id\": \"${OSM_PROJECT}\"
            }'| jq -r '.id'")
            
         
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Failed to retrieve OSM token"
            exit 1
          fi
          
          echo "OSM_TOKEN=${TOKEN}" >> $GITHUB_ENV
          echo "✅ Token retrieved successfully"
          END=$(date +%s)
        env:
          OSM_HOSTNAME: 10.7.230.201.nip.io
          OSM_USER: ${{ secrets.OSM_USER }}
          OSM_PASSWORD: ${{ secrets.OSM_PASSWORD }}
          OSM_PROJECT: ${{ secrets.OSM_PROJECT }}


      - name: Write config from base64 input
        id: config-prep
        run: |
          START=$(date +%s)
          echo "${{ inputs.config_base64 }}" | base64 -d > config5gc.yaml
          echo "✅ Config file decoded"
          END=$(date +%s)
          DURATION=$((END - START))
          echo "config_duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "⏱️  Config preparation: ${DURATION}s"

      - name: Deploy free5gc
        id: ns-deploy
        run: |
          START=$(date +%s)
          python3 << 'PYTHON_EOF'
          import yaml
          import os
          
          # Carregar config do usuário
          with open('config5gc.yaml', 'r') as f:
              config = yaml.safe_load(f)
          
          # Campos obrigatórios
          base_config = {
              'nsName': 'free5gc',
              'nsdId': '473a08f2-becc-4dfa-bac4-74f95573f027',
              'vimAccountId': os.environ['VIM_ID']
          }
          
          # Mesclar configs
          final_payload = {**base_config, **config}
          
          # Salvar como YAML
          with open('/tmp/ns_deploy.yaml', 'w') as f:
              yaml.dump(final_payload, f, default_flow_style=False, sort_keys=False)
          
          print("✅ Payload created")
          PYTHON_EOF
          
          # Transferir payload para OSM host
          scp /tmp/ns_deploy.yaml osm:/tmp/ns_deploy.yaml
          
          # Deploy NS
          NS_INSTANCE_ID=$(ssh -o PreferredAuthentications=publickey osm \
            "curl -k -v -X POST https://${OSM_HOSTNAME}/osm/nslcm/v1/ns_instances_content \
              -H 'Authorization: Bearer ${OSM_TOKEN}' \
              -H 'Content-Type: application/yaml' \
              -H 'Accept: application/json' \
              --data-binary @/tmp/ns_deploy.yaml | jq -r '.id'")

          echo "=== API Response ==="
          echo "$NS_INSTANCE_ID"
          if [ -z "$NS_INSTANCE_ID" ] || [ "$NS_INSTANCE_ID" = "null" ]; then
            echo "❌ Failed to deploy NS"
            echo "$NS_RESPONSE"
            exit 1
          fi
          
          echo "NS_INSTANCE_ID=${NS_INSTANCE_ID}" >> $GITHUB_ENV
          echo "✅ NS deployed successfully with ID: ${NS_INSTANCE_ID}"
          END=$(date +%s)
          DURATION=$((END - START))
          echo "ns_create_duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "⏱️  NS Creation: ${DURATION}s"
        env:
          OSM_HOSTNAME: 10.7.230.201.nip.io
          OSM_TOKEN: ${{ env.OSM_TOKEN }}
          VIM_ID: ${{ inputs.vim_id }}

      - name: ⏱️ Monitor NS Deployment
        id: ns-monitor
        run: |
          set -e

          echo "OSM_HOSTNAME=${OSM_HOSTNAME}"
          echo "NS_INSTANCE_ID=${NS_INSTANCE_ID}"

          START=$(date +%s)

          MAX_WAIT=900
          POLL_INTERVAL=10
          MONITOR_START=$(date +%s)
          READY=false

          while true; do
            CURRENT=$(date +%s)
            ELAPSED=$((CURRENT - MONITOR_START))

            RAW_STATUS=$(ssh osm "export OSM_HOSTNAME=${OSM_HOSTNAME} && \
              osm ns-show ${NS_INSTANCE_ID} --literal | grep -i operational-status | awk '{print \$NF}' | xargs")


            STATUS_WORD=$(echo "${RAW_STATUS}" | awk '{print $2}')

            if [[ "${STATUS_WORD}" == "running" ]] || [[ "${STATUS_WORD}" == "READY" ]]; then
              echo "✓ NS is READY"
              READY=true
              break
            fi

            if (( ELAPSED > MAX_WAIT )); then
              echo "⚠️ Timeout after 15 minutes"
              break
            fi

            sleep "${POLL_INTERVAL}"
          done

          END=$(date +%s)
          DURATION=$((END - START))

          echo "ns_monitor_duration=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "⏱️ NS Monitoring: ${DURATION}s"
          echo "ready_status=${READY}" >> "$GITHUB_OUTPUT"
        env:
          OSM_HOSTNAME: 10.7.230.201.nip.io
          NS_INSTANCE_ID: ${{ env.NS_INSTANCE_ID }}
      
      # ============================================
      # VALIDAÇÃO
      # ============================================
      - name: Validate deployment
        run: |
          echo "Checking free5GC pods..."
          sshpass -p "${{ secrets.CLUSTER_PASSWORD }}" \
          ssh cluster \
          'sudo microk8s.kubectl get pods -A --field-selector=status.phase=Running -o name | sed "s/^pod\///"'
      
