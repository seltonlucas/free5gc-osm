name: Deploy functions
run-name: ODIM-${{ inputs.experiment_id || github.event.client_payload.experiment_id || format('odim-{0}', github.run_id) }}
on:
  workflow_dispatch:
    inputs:
      cluster_ip:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
      config_base64:
        required: true
        type: string
      experiment_id:
        required: false
        type: string
      minimum_ready_nodes:
        required: false
        type: number
        default: 1
      readiness_timeout_s:
        required: false
        type: number
        default: 900
      cluster_user:
        required: false
        type: string
        default: packer
      upstream_run_id:
        required: false
        type: string
      upstream_run_attempt:
        required: false
        type: string
  repository_dispatch:
    types: [ondemand]
permissions:
  contents: read

jobs:
  ondemand-test:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      # ============================================
      # INÍCIO - Capturar timestamp inicial
      # ============================================
      - name: 📊 Start Timer
        id: start-timer
        run: |
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT
          echo "🕐 Workflow started at: $(date '+%Y-%m-%d %H:%M:%S')"
      
      # ============================================
      # SETUP
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate and normalize event
        run: python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json" context p2

      - name: 📊 Checkpoint - Checkout
        run: |
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          NOW=$(date +%s)
          ELAPSED=$((NOW - START_TIME))
          echo "✓ Checkout completed in ${ELAPSED}s"

      - name: Configure SSH
        run: |
          START=$(date +%s)
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/proxy.key
          chmod 600 ~/.ssh/proxy.key
          echo "$OSM_KEY" > ~/.ssh/osm.key
          chmod 600 ~/.ssh/osm.key
          cat >>~/.ssh/config <<END
          Host proxy
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/proxy.key
            StrictHostKeyChecking no
            Port $SSH_PORT
          Host osm
            HostName $OSM_HOST
            User $OSM_USER
            IdentityFile ~/.ssh/osm.key
            StrictHostKeyChecking no
            ProxyJump proxy
          Host cluster
            HostName $CLUSTER_HOST
            User $CLUSTER_USER
            StrictHostKeyChecking no
            ProxyJump proxy
          END
          if [ -n "$CLUSTER_SSH_KEY" ]; then
            printf "%s\n" "$CLUSTER_SSH_KEY" > ~/.ssh/cluster.key
            chmod 600 ~/.ssh/cluster.key
            echo "ODIM_SSH_IDENTITY=$HOME/.ssh/cluster.key" >> "$GITHUB_ENV"
          fi
          END=$(date +%s)
          echo "⏱️  SSH config: $((END - START))s"
        env:
          SSH_USER: ${{ secrets.PROXY_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PROXY_KEY }}
          SSH_HOST: ${{ secrets.PROXY_HOST }}
          SSH_PORT: ${{ secrets.PROXY_PORT }}
          OSM_USER: ${{ secrets.USERNAME }}
          OSM_HOST: ${{ secrets.HOST }}
          OSM_KEY: ${{ secrets.KEY }}
          OSM_PORT: ${{ secrets.HOST }}
          CLUSTER_HOST: ${{ env.ODIM_CLUSTER_IP }}
          CLUSTER_USER: ${{ env.ODIM_CLUSTER_USER }}
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}

      - name: Install sshpass
        run: |
          sudo apt-get install -y sshpass

      - name: Wait for Kubernetes readiness before OSM mutations
        id: cluster-ready
        env:
          SSHPASS: ${{ secrets.CLUSTER_PASSWORD }}
        run: >-
          python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json"
          gate --report metrics/cluster-readiness.json

      - name: Retrieve OSM token
        run: |
          START=$(date +%s)
          TOKEN=$(ssh -o PreferredAuthentications=publickey osm \
          "curl -k -X POST https://${OSM_HOSTNAME}/osm/admin/v1/tokens \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{
              \"username\": \"${OSM_USER}\",
              \"password\": \"${OSM_PASSWORD}\",
              \"project_id\": \"${OSM_PROJECT}\"
            }'| jq -r '.id'")
            
         
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Failed to retrieve OSM token"
            exit 1
          fi
          
          echo "::add-mask::$TOKEN"
          echo "OSM_TOKEN=${TOKEN}" >> $GITHUB_ENV
          echo "✅ Token retrieved successfully"
          END=$(date +%s)
        env:
          OSM_HOSTNAME: 10.7.230.201.nip.io
          OSM_USER: ${{ secrets.OSM_USER }}
          OSM_PASSWORD: ${{ secrets.OSM_PASSWORD }}
          OSM_PROJECT: ${{ secrets.OSM_PROJECT }}

      - name: Create dummy vim
        id: vim-register
        run: |
          START=$(date +%s)
          VIM_RESPONSE=$(ssh -o PreferredAuthentications=publickey osm \
            "curl -k -X POST https://${OSM_HOSTNAME}/osm/admin/v1/vim_accounts \
              -H 'Authorization: Bearer ${OSM_TOKEN}' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d '{
                \"name\": \"${VIM_NAME}\",
                \"vim_type\": \"dummy\",
                \"vim_user\": \"u\",
                \"vim_password\": \"p\",
                \"vim_tenant_name\": \"p\",
                \"vim_url\": \"http://localhost/dummy\"
              }'")
          
          VIM_ID=$(echo "$VIM_RESPONSE" | jq -r '.id')
          
          if [ -z "$VIM_ID" ] || [ "$VIM_ID" = "null" ]; then
            echo "❌ Failed to create VIM account"
            echo "$VIM_RESPONSE"
            exit 1
          fi
          
          echo "VIM_ID=${VIM_ID}" >> $GITHUB_ENV
          echo "✅ VIM created with ID: ${VIM_ID}"
          END=$(date +%s)
          DURATION=$((END - START))
          echo "vim_duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "⏱️  VIM Registration: ${DURATION}s"
        env:
          OSM_HOSTNAME: 10.7.230.201.nip.io
          OSM_TOKEN: ${{ env.OSM_TOKEN }}
          VIM_NAME: ${{ env.ODIM_CLUSTER_NAME }}
          
      - name: Retrieve kubeconfig
        id: kubeconfig
        env:
          SSHPASS: ${{ secrets.CLUSTER_PASSWORD }}
        run: |
          START=$(date +%s)
          python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json" kubeconfig --output "$HOME/kubeconfig"
          END=$(date +%s)
          echo "kubeconfig_duration=$((END - START))" >> "$GITHUB_OUTPUT"

      - name: Register cluster
        id: k8s-register
        run: |
          START=$(date +%s)
          python3 << 'PYTHON_EOF'
          import yaml
          import os

          # Ler e parsear kubeconfig como objeto
          with open(os.path.expanduser('~/kubeconfig'), 'r') as f:
              kubeconfig = yaml.safe_load(f)
          
          # Criar payload
          payload = {
              'name': os.environ['CLUSTER_NAME'],
              'k8s_version': '1.26',
              'vim_account': os.environ['VIM_ID'],
              'description': 'My K8s cluster',
              'nets': {
                  'net1': 'osm-ext'
              },
              "credentials": kubeconfig
          }
          with open('/tmp/k8s_payload.yaml', 'w') as f:
              yaml.dump(payload, f, default_flow_style=False, sort_keys=False)
          
          print("✅ Payload created")
          PYTHON_EOF
          
          # Transferir payload para OSM host
          scp /tmp/k8s_payload.yaml osm:/tmp/k8s_payload.yaml 2>/dev/null
          
          K8S_RESPONSE=$(ssh -o PreferredAuthentications=publickey osm \
          "curl -k -X POST https://${OSM_HOSTNAME}/osm/admin/v1/k8sclusters \
          -H 'Authorization: Bearer ${OSM_TOKEN}' \
          -H 'Content-Type: application/yaml' \
          -H 'Accept: application/json' \
          --data-binary @/tmp/k8s_payload.yaml")
          
          echo "=== API Response ==="
          echo "$K8S_RESPONSE"
          
          K8S_CLUSTER_ID=$(echo "$K8S_RESPONSE" | jq -r '.id' )
          
          if [ -z "$K8S_CLUSTER_ID" ] || [ "$K8S_CLUSTER_ID" = "null" ]; then
            echo "❌ Failed to register K8s cluster"
            echo "=== Full Response ==="
            echo "$K8S_RESPONSE" | jq . 2>/dev/null || echo "$K8S_RESPONSE"
            exit 1
          fi
          
          echo "K8S_CLUSTER_ID=${K8S_CLUSTER_ID}" >> $GITHUB_ENV
          echo "✅ K8s cluster registered with ID: ${K8S_CLUSTER_ID}"
          END=$(date +%s)
          DURATION=$((END - START))
          echo "k8s_duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "⏱️  K8s Cluster Registration: ${DURATION}s"
          sleep 60
        env:
          CLUSTER_NAME: ${{ env.ODIM_CLUSTER_NAME }}
          OSM_HOSTNAME: 10.7.230.201.nip.io
          OSM_TOKEN: ${{ env.OSM_TOKEN }}
          VIM_ID: ${{ env.VIM_ID }}

      - name: Write config from base64 input
        id: config-prep
        run: |
          START=$(date +%s)
          python3 -m scripts.odim_ci --context "$RUNNER_TEMP/odim-context.json" config --output config5gc.yaml
          END=$(date +%s)
          echo "config_duration=$((END - START))" >> "$GITHUB_OUTPUT"

      - name: Deploy free5gc
        id: ns-deploy
        run: |
          START=$(date +%s)
          python3 << 'PYTHON_EOF'
          import yaml
          import os
          
          # Carregar config do usuário
          with open('config5gc.yaml', 'r') as f:
              config = yaml.safe_load(f)
          
          # Campos obrigatórios
          base_config = {
              'nsName': 'free5gc',
              'nsdId': '473a08f2-becc-4dfa-bac4-74f95573f027',
              'vimAccountId': os.environ['VIM_ID']
          }
          
          # Mesclar configs
          final_payload = {**base_config, **config}
          
          # Salvar como YAML
          with open('/tmp/ns_deploy.yaml', 'w') as f:
              yaml.dump(final_payload, f, default_flow_style=False, sort_keys=False)
          
          print("✅ Payload created")
          PYTHON_EOF
          
          # Transferir payload para OSM host
          scp /tmp/ns_deploy.yaml osm:/tmp/ns_deploy.yaml
          
          # Deploy NS
          NS_INSTANCE_ID=$(ssh -o PreferredAuthentications=publickey osm \
            "curl -k -X POST https://${OSM_HOSTNAME}/osm/nslcm/v1/ns_instances_content \
              -H 'Authorization: Bearer ${OSM_TOKEN}' \
              -H 'Content-Type: application/yaml' \
              -H 'Accept: application/json' \
              --data-binary @/tmp/ns_deploy.yaml | jq -r '.id'")

          echo "=== API Response ==="
          echo "$NS_INSTANCE_ID"
          if [ -z "$NS_INSTANCE_ID" ] || [ "$NS_INSTANCE_ID" = "null" ]; then
            echo "❌ Failed to deploy NS"
            echo "$NS_RESPONSE"
            exit 1
          fi
          
          echo "NS_INSTANCE_ID=${NS_INSTANCE_ID}" >> $GITHUB_ENV
          echo "✅ NS deployed successfully with ID: ${NS_INSTANCE_ID}"
          END=$(date +%s)
          DURATION=$((END - START))
          echo "ns_create_duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "⏱️  NS Creation: ${DURATION}s"
        env:
          OSM_HOSTNAME: 10.7.230.201.nip.io
          OSM_TOKEN: ${{ env.OSM_TOKEN }}
          VIM_ID: ${{ env.VIM_ID }}

      - name: Monitor NS readiness with structured OSM state
        id: ns-monitor
        run: >-
          python3 -m scripts.odim_ns --context "$RUNNER_TEMP/odim-context.json"
          --id "$NS_INSTANCE_ID" --hostname "$OSM_HOSTNAME"
          --report metrics/ns-readiness.json
        env:
          OSM_HOSTNAME: 10.7.230.201.nip.io
          NS_INSTANCE_ID: ${{ env.NS_INSTANCE_ID }}
          OSM_TOKEN: ${{ env.OSM_TOKEN }}
          OSM_CA_FILE: ${{ vars.OSM_CA_FILE }}

      # ============================================
      # VALIDAÇÃO
      # ============================================
      - name: Inspect deployment pods (not a functional 5G probe)
        env:
          SSHPASS: ${{ secrets.CLUSTER_PASSWORD }}
        run: |
          if [[ -n "${ODIM_SSH_IDENTITY:-}" ]]; then
            SSH=(ssh -o BatchMode=yes -o ConnectTimeout=10 -i "$ODIM_SSH_IDENTITY" cluster)
          else
            SSH=(sshpass -e ssh -o ConnectTimeout=10 -o NumberOfPasswordPrompts=1 cluster)
          fi
          "${SSH[@]}" "sudo -n microk8s.kubectl --request-timeout=10s get pods -A"

      # ============================================
      # RESUMO FINAL
      # ============================================
      - name: Upload cluster readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics/*.json
          if-no-files-found: warn

      - name: 📊 Performance Summary
        if: always()
        run: |
          START_TIME=${{ steps.start-timer.outputs.start_time }}
          END_TIME=$(date +%s)
          TOTAL_DURATION=$((END_TIME - START_TIME))
          
          echo "========================================"
          echo "   OSM PIPELINE PERFORMANCE REPORT"
          echo "========================================"
          echo ""
          echo "VIM Registration:    ${{ steps.vim-register.outputs.vim_duration }}s"
          echo "Kubeconfig Gen:      ${{ steps.kubeconfig.outputs.kubeconfig_duration }}s"
          echo "K8s Registration:    ${{ steps.k8s-register.outputs.k8s_duration }}s"
          echo "Config Preparation:  ${{ steps.config-prep.outputs.config_duration }}s"
          echo "NS Creation:         ${{ steps.ns-deploy.outputs.ns_create_duration }}s"
          echo "NS Monitoring:       ${{ steps.ns-monitor.outputs.ns_monitor_duration }}s"
          echo ""
          echo "TOTAL PIPELINE:      ${TOTAL_DURATION}s (~$((TOTAL_DURATION / 60))m)"
          echo "========================================"
          
          # Salvar em artifact
          cat > performance_report_osm.txt <<EOF
          OSM Pipeline Performance Report
          Execution Date: $(date '+%Y-%m-%d %H:%M:%S')
          Cluster: ${ODIM_CLUSTER_NAME}
          Cluster IP: ${ODIM_CLUSTER_IP}
          
          Timings:
          - VIM Registration:    ${{ steps.vim-register.outputs.vim_duration }}s
          - Kubeconfig Gen:      ${{ steps.kubeconfig.outputs.kubeconfig_duration }}s
          - K8s Registration:    ${{ steps.k8s-register.outputs.k8s_duration }}s
          - Config Preparation:  ${{ steps.config-prep.outputs.config_duration }}s
          - NS Creation:         ${{ steps.ns-deploy.outputs.ns_create_duration }}s
          - NS Monitoring:       ${{ steps.ns-monitor.outputs.ns_monitor_duration }}s
          
          Total: ${TOTAL_DURATION}s (~$((TOTAL_DURATION / 60))m)
          EOF
      
      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-osm
          path: performance_report_osm.txt